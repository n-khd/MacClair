name: gitleaks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer gitleaks
        run: |
          V=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # On ne scanne que ce qui vient d'être poussé (l'historique ancien
      # contient des .env déjà supprimés du repo le 13/11/2026).
      - name: Scanner les commits poussés
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.event.after }}"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "Plage scannée : $RANGE"
          gitleaks git --redact --no-banner --exit-code 1 \
            --report-format sarif --report-path gitleaks.sarif \
            --log-opts="$RANGE" .

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
