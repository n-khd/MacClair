name: Captures d'écran

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: Rendre l'interface en PNG (FR + EN)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'application (signature ad hoc)
        env:
          SU_FEED_URL: https://n-khd.github.io/MacClair/appcast.xml
          SU_PUBLIC_ED_KEY: "G9sIb+Be2ryNBDEhaRWqvFXm8r7O18oJMqVu+IC7kEk="
        run: |
          set -euo pipefail
          export MACCLAIR_VERSION="0.0.0-shots"
          export MACCLAIR_BUILD="$GITHUB_RUN_NUMBER"
          zsh ./build-app.sh

      - name: Compiler l'outil de capture
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          mkdir -p .build
          xcrun swiftc -sdk "$SDKROOT" -target "$(uname -m)-apple-macosx14.0" -parse-as-library -O \
            -swift-version 5 -DSNAPSHOT \
            -module-cache-path .cache/swift \
            -o .build/macclair-snapshot \
            Sources/MacClair/*.swift Sources/MacClairSnapshot/main.swift

      - name: Rendre les captures (depuis le bundle, pour les traductions)
        run: |
          set -euo pipefail
          cp .build/macclair-snapshot dist/MacClair.app/Contents/MacOS/macclair-snapshot
          ./dist/MacClair.app/Contents/MacOS/macclair-snapshot dist/screenshots
          ls -l dist/screenshots

      - name: Publier les captures
        uses: actions/upload-artifact@v4
        with:
          name: macclair-screenshots
          path: dist/screenshots/*.png
