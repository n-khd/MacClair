name: Release macOS signée et notariée

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex: 0.5.1)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Compiler, signer, notarier, publier
    runs-on: macos-14
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Déterminer la version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version : $VERSION"

      - name: Importer le certificat Developer ID
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12_BASE64:-}" ]; then
            echo "::error::Secret DEVELOPER_ID_P12_BASE64 manquant."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning

      - name: Compiler et signer l'application
        run: |
          set -euo pipefail
          IDENTITY="$(security find-identity -v -p codesigning \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::Aucune identité « Developer ID Application » trouvée dans le keychain."
            exit 1
          fi
          echo "Identité de signature : $IDENTITY"
          export CODESIGN_IDENTITY="$IDENTITY"
          export MACCLAIR_VERSION="$VERSION"
          export MACCLAIR_BUILD="${GITHUB_RUN_NUMBER}"
          zsh ./build-app.sh

      - name: Vérifier la signature
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 dist/MacClair.app
          codesign -dv --verbose=4 dist/MacClair.app 2>&1 \
            | grep -E "Authority|TeamIdentifier|Timestamp|Runtime" || true

      - name: Soumettre à la notarisation Apple
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "$ASC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent dist/MacClair.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 40m
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/notarize.zip"

      - name: Agrafer le ticket de notarisation
        run: |
          set -euo pipefail
          xcrun stapler staple -v dist/MacClair.app

      - name: Contrôle Gatekeeper
        run: |
          set -euo pipefail
          spctl -a -vvv -t exec dist/MacClair.app
          xcrun stapler validate -v dist/MacClair.app

      - name: Empaqueter l'archive
        run: |
          set -euo pipefail
          ARCHIVE="MacClair-$VERSION-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/MacClair.app "dist/$ARCHIVE"
          ( cd dist && shasum -a 256 "$ARCHIVE" > SHA256SUMS )
          cat dist/SHA256SUMS
          shasum -a 256 "dist/$ARCHIVE"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "MacClair $VERSION" \
              --notes "Build signée avec un certificat Developer ID et notariée par Apple. Aucun contournement de Gatekeeper nécessaire."
          fi
          gh release upload "$TAG" "dist/$ARCHIVE" "dist/SHA256SUMS" \
            -R "$GITHUB_REPOSITORY" --clobber

      - name: Conserver les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: MacClair-${{ env.VERSION }}-notarized
          path: |
            dist/${{ env.ARCHIVE }}
            dist/SHA256SUMS
