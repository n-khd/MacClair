name: Release macOS signée et notariée

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex: 0.5.2)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Compiler, signer, notarier, publier
    runs-on: macos-14
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Déterminer la version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version : $VERSION"

      - name: Importer le certificat Developer ID
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12_BASE64:-}" ]; then
            echo "::error::Secret DEVELOPER_ID_P12_BASE64 manquant."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning
          IDENTITY="$(security find-identity -v -p codesigning \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::Aucune identité « Developer ID Application » trouvée dans le keychain."
            exit 1
          fi
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Identité de signature : $IDENTITY"

      - name: Préparer la clé de notarisation
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "$ASC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/notary.p8"
          {
            echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Compiler et signer l'application
        run: |
          set -euo pipefail
          export CODESIGN_IDENTITY="$IDENTITY"
          export MACCLAIR_VERSION="$VERSION"
          export MACCLAIR_BUILD="${GITHUB_RUN_NUMBER}"
          zsh ./build-app.sh

      - name: Vérifier la signature
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 dist/MacClair.app
          codesign -dv --verbose=4 dist/MacClair.app 2>&1 \
            | grep -E "Authority|TeamIdentifier|Timestamp|Runtime" || true

      - name: Notariser et agrafer l'application
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/MacClair.app "$RUNNER_TEMP/notarize-app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize-app.zip" \
            --key "$NOTARY_KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 40m
          rm -f "$RUNNER_TEMP/notarize-app.zip"
          xcrun stapler staple -v dist/MacClair.app
          spctl -a -vvv -t exec dist/MacClair.app
          xcrun stapler validate -v dist/MacClair.app

      - name: Empaqueter l'archive zip
        run: |
          set -euo pipefail
          ZIP="MacClair-$VERSION-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/MacClair.app "dist/$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          shasum -a 256 "dist/$ZIP"

      - name: Fabriquer et signer le DMG
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto dist/MacClair.app "$STAGE/MacClair.app"
          ln -s /Applications "$STAGE/Applications"
          DMG="MacClair-$VERSION-macOS-arm64.dmg"
          hdiutil create -volname "MacClair" -srcfolder "$STAGE" -ov -format UDZO "dist/$DMG"
          codesign --force --timestamp --sign "$IDENTITY" "dist/$DMG"
          codesign --verify --strict "dist/$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          ls -lh "dist/$DMG"

      - name: Notariser et agrafer le DMG
        run: |
          set -euo pipefail
          xcrun notarytool submit "dist/$DMG" \
            --key "$NOTARY_KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 40m
          xcrun stapler staple -v "dist/$DMG"
          xcrun stapler validate -v "dist/$DMG"
          spctl -a -t open --context context:primary-signature -v "dist/$DMG"

      - name: Écrire les sommes de contrôle
        run: |
          set -euo pipefail
          ( cd dist && shasum -a 256 "$ZIP" "$DMG" > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          {
            echo "Build compilée sur runner macOS, signée avec un certificat Developer ID et notariée par Apple."
            echo "Aucun contournement de Gatekeeper n'est nécessaire."
            echo ""
            echo "### Installation"
            echo ""
            echo "- DMG : ouvrir \`$DMG\`, puis glisser MacClair dans Applications."
            echo "- Homebrew : \`brew install --cask najmabdi7/tap/macclair\`"
            echo "- Zip : décompresser et déplacer \`MacClair.app\` dans Applications."
            echo ""
            echo "Intégrité : comparer la somme d'un fichier téléchargé avec le fichier \`SHA256SUMS\` de cette release."
          } > "$RUNNER_TEMP/notes.md"
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "MacClair $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" "dist/$DMG" "dist/$ZIP" "dist/SHA256SUMS" \
            -R "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --latest

      - name: Mettre à jour le cask Homebrew
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "Secret TAP_TOKEN absent : cask Homebrew non mis à jour automatiquement."
            exit 0
          fi
          SHA="$(shasum -a 256 "dist/$DMG" | awk '{print $1}')"
          rm -rf "$RUNNER_TEMP/tap"
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/Najmabdi7/homebrew-tap.git" \
            "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          {
            echo 'cask "macclair" do'
            echo "  version \"$VERSION\""
            echo "  sha256 \"$SHA\""
            echo ""
            echo '  url "https://github.com/Najmabdi7/MacClair/releases/download/v#{version}/MacClair-#{version}-macOS-arm64.dmg"'
            echo '  name "MacClair"'
            echo '  desc "Utilitaire macOS libre pour analyser le stockage et deplacer des fichiers vers la Corbeille"'
            echo '  homepage "https://github.com/Najmabdi7/MacClair"'
            echo ""
            echo "  livecheck do"
            echo "    url :url"
            echo "    strategy :github_latest"
            echo "  end"
            echo ""
            echo "  depends_on arch: :arm64"
            echo '  depends_on macos: ">= :sonoma"'
            echo ""
            echo '  app "MacClair.app"'
            echo "end"
          } > "$RUNNER_TEMP/tap/Casks/macclair.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/macclair.rb
          if git diff --cached --quiet; then
            echo "Cask déjà à jour."
            exit 0
          fi
          git commit -m "macclair $VERSION"
          git push origin HEAD

      - name: Supprimer la clé de notarisation
        if: always()
        run: rm -f "$RUNNER_TEMP/notary.p8"

      - name: Conserver les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: MacClair-${{ env.VERSION }}-notarized
          path: |
            dist/${{ env.ZIP }}
            dist/${{ env.DMG }}
            dist/SHA256SUMS
